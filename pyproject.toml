[project]
name = "garmin-visualize-all-activities"
version = "0.0.66"
description = "Local Garmin Connect activity exporter"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
  "garminconnect==0.3.10",
  "curl-cffi==0.16.0",
  "PyQt6==6.11.0",
  "PyQt6-Qt6==6.11.1",
  "PyQt6-sip==13.12.0",
]

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["activity_map*", "garmin_export*"]

[project.optional-dependencies]
dev = [
  "build==1.5.0",
  "coverage==7.15.4",
  "mypy==2.3.0",
  "pytest-cov==7.1.0",
  "pytest-qt==4.5.0",
  "pytest==9.1.1",
  "radon==6.0.1",
  "ruff==0.16.3",
  "vulture==2.16",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--cov=activity_map",
  "--cov=garmin_export",
  "--cov-report=term-missing",
  "--cov-fail-under=95",
]

[tool.coverage.run]
omit = ["activity_map/__main__.py", "garmin_export/__main__.py"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
files = ["activity_map", "garmin_export", "tests", "benchmarks"]

[[tool.mypy.overrides]]
module = ["PyQt6.*"]
ignore_missing_imports = true
